
services:
  postgres:
    image: postgres:16
    container_name: tile_quality_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tile_quality_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - tile_quality_pgdata:/var/lib/postgresql/data

volumes:
  tile_quality_pgdata:
